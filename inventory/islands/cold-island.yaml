notes:
  - "Checked in BlueStacks on 2026-11-09: map summary, castle panel, every Market Monsters card, and all three Book pages. Owned counts come from the Market cards (screenshots listed under evidence)."
  - "The castle is now Polished Frozium Castle with 147/150 beds occupied (castle Stats tab). The map summary for Cold Island shows the same 147/150 and Book counters 22/28 Commons, 11/21 Rares, 1/21 Epics, 0/3 seasonal, 15/225 costumes."
  - "Commons 22/28: the eighteen August discoveries plus Mi, Fa, Sol, and Ti, each now owned 1. Unlit are Wubbox, Tawkerr, Maggpi, Do, Re, and La. Seasonal 0/1 is Yool."
  - "The Common Wubbox card is greyed out with no count, so it is owned: 1. It shows grey in the Book, so it is still being filled (discovered: false), as on Plant Island."
  - "Rares 11/21, each named from its Book entry: Tweedle, Potbelly, Toe Jammer, Mammott, Pango, Furcorn, Thumpies, Congle, Bowgart, Deedge, and Terrene Sol. The Rare total rose from 19 to 21; the page now includes the prize Dipsters Vitreous Ti, Terrene Sol, and Waxen La."
  - "Rare Grumpyre, recorded as discovered on 2026-08-22, is an unlit silhouette whose Book entry says Monster Unavailable (training/screenshots/2026-11-09-cold-island-book-rare-grumpyre-unavailable.jpg), so it is now discovered: false. The August reading was probably wrong."
  - "Epics 1/21: the lit Epic is Epic Mammott (named from its Book entry), which resolves the August unresolved Epic discovery. No Epic Mammott Market card, so owned stays 0. The Epic total rose from 19 to 21; the page now includes the prize Dipsters King Do, Queen Re, and Bishop Mi, all locked behind Prize wins."
  - "Rare Tweedle and Rare Furcorn had no Market card on 2026-11-09, so their owned: 1 is carried over from August. Rare Toe Jammer and Epic Toe Jammer were on a timed offer (6h 29m left); Rare shows 1 owned, Epic 0."
  - "Common Deedge rose from 3 to 17 on its Market card. Potbelly fell from 2 to 1 and Congle rose from 1 to 2. A 'Cobham' Quibble Buyback card is ignored."
  - "Bed audit on 2026-11-09: rows account for 154 beds against the panel's 147, a delta of -7. Candidates are Hotel check-ins (likely among the 17 Deedge), the carried-over Rare Tweedle (1) and Rare Furcorn (2), or the unfilled Wubbox (6). Breeding, Nursery, and Hotel state were not checked."
